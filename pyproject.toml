[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtb-game-dynamics"
version = "0.1.0"
description = "Deep Tangent Bundle approximation of distributional game dynamics"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Mengwei Sun"}]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy>=1.24",
    "matplotlib>=3.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "ipykernel>=6"]

[project.urls]
Repository = "https://github.com/sun-mengwei/deep-tangent-bundle-method-for-game-dynamics"
Issues = "https://github.com/sun-mengwei/deep-tangent-bundle-method-for-game-dynamics/issues"

[tool.setuptools.packages.find]
where = ["src"]

